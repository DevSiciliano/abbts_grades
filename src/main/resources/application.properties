spring.application.name=ABBTS_Grades

spring.jpa.hibernate.ddl-auto=validate

# H2 file database, so data survives restarts
spring.datasource.url=jdbc:h2:file:./data/grades;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

# H2 web console at /h2-console
spring.h2.console.enabled=true

# Log SQL while developing
spring.jpa.show-sql=true